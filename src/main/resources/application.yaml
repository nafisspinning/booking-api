
spring:
  application:
    name: booking

  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
    driver-class-name: org.postgresql.Driver
  
  flyway:
    # enabled: true
    locations: classpath:db/migration, classpath:db/seed
    # baseline-on-migrate: true
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-ganti-dengan-string-acak-min-32-karakter}
    ttl: 2h
    


management:
  endpoints:
    web:
      exposure:
        include: health, info
